<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0b1220">
  <title>Durak Online Assistant</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="style-fixes.css">
</head>
<body>
  <div id="setup-panel" class="panel">
    <h2>Game Setup</h2>
    <h3 id="setup-instruction">1. Click your 6 starting cards</h3>
    <div id="setup-palette" class="card-grid"></div>
    <div class="setup-controls">
      <button id="btn-start-me" onclick="startGame('me')" disabled>I Start</button>
      <button id="btn-start-opp" onclick="startGame('opp')" disabled>Opponent Starts</button>
    </div>
  </div>

  <div id="game-panel" class="panel" style="display: none;">
    <div id="game-view">
      <div id="opponent-zone">
        <div id="opp-avatar">Opponent (<span id="opp-count">6</span>)</div>
        <div id="opp-hand-unknown" class="card-row"></div>
      </div>
      <div id="center-table">
        <div id="deck-container">
          <div id="deck-count">24</div>
          <div id="trump-card" class="card trump-rotate"></div>
        </div>
        <div id="active-bouts"></div>
      </div>
      <div id="player-zone"><div id="my-hand" class="card-row card-fan"></div></div>
    </div>

    <div id="control-panel">
      <h3 id="turn-indicator" aria-live="polite"></h3>
      <div class="control-row action-row">
        <button class="action-btn undo-btn" onclick="undo()">Undo</button>
        <button class="action-btn bito-btn" data-action="bito" onclick="resolveBout('bito')">Bito</button>
        <button class="action-btn take-btn" id="btn-take" onclick="resolveBout('take')">Take</button>
      </div>

      <section id="win-probability" class="win-probability" aria-live="polite" aria-label="Estimated chance of winning">
        <div class="win-probability-heading"><span>Win chance</span><span id="win-probability-value">50%</span></div>
        <div class="win-probability-track" aria-hidden="true"><div class="win-probability-fill"></div></div>
        <div class="win-probability-note">Calculating from sampled hidden hands and future play.</div>
      </section>

      <section class="control-section"><h4 class="section-title">Opponent's Hand</h4><div id="quick-opp-hand" class="card-row quick-hand"></div></section>
      <section class="control-section palette-section"><div id="play-palette" class="card-grid"></div></section>
      <section id="ai-suggestion" class="suggestion-box" aria-live="polite"><span class="suggestion-label">Suggestion</span><span id="suggestion-text"></span></section>
      <section class="control-section"><h4 class="section-title">Quick Access: My Hand</h4><div id="quick-my-hand" class="card-row quick-hand"></div></section>
    </div>
  </div>

  <!-- rules.js -> engine-v4.js -> app.js -> fixes.js -> win-probability.js -->
  <script src="js/rules.js"></script>
  <script src="js/engine-v4.js"></script>
  <script src="js/app.js"></script>
  <script src="js/fixes.js"></script>
  <script src="js/win-probability.js"></script>
</body>
</html>
